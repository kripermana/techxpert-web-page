# Contoh konfigurasi Nginx untuk TechXpert (situs statis).
# Salin ke /etc/nginx/sites-available/techxpert, sesuaikan server_name dan path,
# lalu aktifkan. Jalankan `sudo certbot --nginx -d techxpert.dev -d www.techxpert.dev`
# untuk HTTPS; certbot akan menambahkan blok listen 443 dan redirect otomatis.

server {
    listen 80;
    listen [::]:80;
    server_name techxpert.dev www.techxpert.dev;

    # Symlink ke rilis aktif, diganti oleh `npm run deploy` setiap deploy.
    root /var/www/techxpert/current;
    index index.html;

    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # File JS/CSS hasil build punya nama unik per build, aman di-cache satu tahun.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # HTML selalu dicek ulang agar pengunjung langsung mendapat versi terbaru.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
}
